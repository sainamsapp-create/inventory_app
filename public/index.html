<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการสินค้าคงคลัง</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4">📦 ระบบจัดการสินค้าคงคลัง (Inventory Management)</h2>
        
        <!-- ฟอร์มเพิ่มสินค้า -->
        <div class="card p-4 mb-4 shadow-sm">
            <h4>เพิ่มสินค้าใหม่</h4>
            <form id="productForm">
                <div class="mb-3">
                    <label class="form-label">ชื่อสินค้า</label>
                    <input type="text" id="name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">ราคา (บาท)</label>
                    <input type="number" id="price" class="form-control" step="any" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">จำนวน</label>
                    <input type="number" id="quantity" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">บันทึกสินค้า</button>
            </form>
        </div>

        <!-- ตารางแสดงสินค้า -->
        <div class="card p-4 shadow-sm">
            <h4>รายการสินค้าทั้งหมด</h4>
            <table class="table table-striped mt-3">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>ชื่อสินค้า</th>
                        <th>ราคา</th>
                        <th>จำนวน</th>
                        <th>จัดการ</th>
                    </tr>
                </thead>
                <tbody id="productTableBody">
                    <!-- ข้อมูลจะถูกโหลดมาแสดงด้วย JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
